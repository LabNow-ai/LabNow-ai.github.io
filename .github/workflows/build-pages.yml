name: Build frontend site and deploy to GitHub Pages

on:
  push:  # Runs on pushes targeting the default branch
    branches: ['main']
  pull_request:  # Runs on pull requests that targeting the default branch
    branches: ['main']
  workflow_dispatch:  # Allows you to run this workflow manually from the Actions tab

permissions:  # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  CNAME: ${{ vars.CNAME }}
  LABNOW_DOMAIN: labnow.cn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }} # `GH_PAT` is a secret that contains your PAT
          repository: ${{ vars.SRC_GITHUB_REPO }}
          ref: ${{ vars.SRC_GITHUB_REPO_REF }}
      - id: detect-package-manager
        run: |
          set -e
          if [ -f "web/package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ -f "web/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ -f "web/yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Unable to determine package manager: no lockfile found in web/"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        if: steps.detect-package-manager.outputs.manager == 'pnpm'
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: web/${{ steps.detect-package-manager.outputs.lockfile }}
      - uses: actions/configure-pages@v6
        with:
          # Automatically inject basePath in your Next.js configuration file and disable server side image optimization
          # You may remove this line if you want to manage the configuration yourself: https://nextjs.org/docs/api-reference/next/image#unoptimized
          static_site_generator: next
      - uses: actions/cache@v6
        with:
          path: |
            web/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json', 'web/pnpm-lock.yaml', 'web/yarn.lock') }}-${{ hashFiles('web/**/*.[jt]s', 'web/**/*.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json', 'web/pnpm-lock.yaml', 'web/yarn.lock') }}-
      - name: Install dependencies
        working-directory: web
        run: ${{ steps.detect-package-manager.outputs.manager }} install
      - name: Build FED
        working-directory: web
        env:
          NEXT_PUBLIC_BASEPATH: "/portal"
        run: |
          mkdir -pv ../out
          ${{ steps.detect-package-manager.outputs.manager }} run export:portal
          test -d apps/portal/src/out
          mv apps/portal/src/out ../out/${NEXT_PUBLIC_BASEPATH}
          cd ../out/${NEXT_PUBLIC_BASEPATH}
          mv ./index.html ./robots.txt ./sitemap.xml favicon.ico ../
          echo "Generate CNAME file" && printf '%s\n' "$CNAME" > ../CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:  # Deployment job
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
